name: CI

on:
  push:

jobs:
  tests:
    name: Tests (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Composer blocks Laravel 11 because of security advisories that are
          # only fixed in Laravel 12.
          - laravel: 11
            php: 8.2
            testbench: ^9.0
            composer-flags: --no-security-blocking
          - laravel: 12
            php: 8.4
            testbench: ^10.0

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: nova_pages_tool_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-laravel-${{ matrix.laravel }}

      - name: Validate Composer files
        run: composer validate --ansi

      - name: Install PHP dependencies
        run: |
          composer config --ansi -- http-basic.nova.laravel.com "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_PASSWORD }}"
          composer require --dev --no-update --ansi "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --ansi ${{ matrix.composer-flags }}

      - name: Run PHP tests
        run: composer test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: nova_pages_tool_testing
          DB_USER: root
          DB_PASSWORD: root

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Laravel ${{ matrix.laravel }} logs
          path: storage/logs/laravel.log

  prettier:
    name: Code style
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - run: npm install

      - run: npx prettier --check .
